<!doctype html>
<html lang="en">
<head>

<title>Wildbound — Field Notes</title>
<style>
:root{color-scheme:dark;--ink:#21342b;--cream:#f3e8c9;--gold:#e4b85e;--muted:#a9b5a4}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#172720;color:var(--cream);font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}body{display:flex;justify-content:center;align-items:center;padding:20px;background:radial-gradient(ellipse at 50% 25%,#314a3c 0,#1d3028 58%,#15221e 100%);overflow-x:hidden}.app{width:min(1160px,100%);}.topbar{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px;gap:12px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;display:grid;place-items:center;border:2px solid #d5ae63;border-radius:12px;background:#d5ae63;color:#26382d;font-size:23px;box-shadow:inset 0 0 0 3px #344c39}.eyebrow{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#b8c5a9}.brand h1{font-size:19px;letter-spacing:1px;margin:2px 0 0;color:#f5e9c8}.status{display:flex;gap:9px;align-items:center}.pill{border:1px solid #536858;background:#20372d;border-radius:20px;padding:8px 12px;font-size:11px;color:#d9e3ca;white-space:nowrap}.pill strong{color:#f2ca74}.frame{background:#121e1a;border:1px solid #61715d;padding:10px;border-radius:15px;box-shadow:0 24px 70px #0008,inset 0 1px #8a9b7770}.screen-shell{position:relative;overflow:hidden;border:3px solid #0b1512;border-radius:6px;background:#7dbb77;aspect-ratio:16/9;touch-action:none}.screen-shell:after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(180deg,#ffffff06,#00000008);box-shadow:inset 0 0 28px #15251c4d}.screen-shell canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}.bottom{display:flex;justify-content:space-between;align-items:center;padding:10px 5px 0;color:#a8b7a5;font-size:10px;letter-spacing:.7px}.bottom span:last-child{color:#e0bb70}.touch-ui{display:none;position:absolute;z-index:4;bottom:12px;left:12px;right:12px;align-items:end;justify-content:space-between;pointer-events:none}.dpad{display:grid;grid-template-columns:42px 42px 42px;grid-template-rows:42px 42px 42px;gap:3px;pointer-events:auto}.touch-btn{border:1px solid #e4d7b29c;background:#172b24c9;color:#fff4d5;border-radius:10px;font:700 19px inherit;touch-action:none;box-shadow:0 3px 0 #09120f88;backdrop-filter:blur(4px)}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .center{grid-column:2;grid-row:2;opacity:.3}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}.touch-actions{display:flex;gap:9px;pointer-events:auto}.touch-actions button{width:55px;height:55px;border-radius:50%;font-size:11px;letter-spacing:.5px}.touch-actions .action-a{background:#d9ac54;color:#28352b;border-color:#f5dda1}.touch-actions .action-b{background:#566f58}.mobile-hint{display:none}
@media(max-width:700px){body{padding:10px 8px;align-items:flex-start;padding-top:max(12px,env(safe-area-inset-top))}.topbar{margin-bottom:8px}.brand-mark{width:34px;height:34px;font-size:18px}.brand h1{font-size:15px}.eyebrow{font-size:8px}.pill{padding:7px 9px;font-size:9px}.frame{padding:5px;border-radius:10px}.screen-shell{border-width:2px}.bottom{font-size:8px;padding-top:7px}.touch-ui{display:flex}.bottom .desktop-hint{display:none}.mobile-hint{display:inline!important}}
@media(max-width:390px){.status .pill:first-child{display:none}.dpad{grid-template-columns:36px 36px 36px;grid-template-rows:36px 36px 36px}.touch-actions button{width:47px;height:47px}}
@media(orientation:portrait) and (max-width:700px){body{padding-bottom:8px}.screen-shell{aspect-ratio:16/9}.touch-ui{bottom:8px}}
</style>

<body>
<main class="app">
  <header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><div class="eyebrow">A pocket field journal</div><h1>WILDBOUND <span style="color:#d7b96d">/</span> 2005</h1></div></div><div class="status"><div class="pill">ROUTE <strong>01</strong> · CLOVERFIELD</div><div class="pill">✿ <strong id="count">0</strong> / 4</div></div></header>
  <section class="frame" aria-label="Wildbound game"><div class="screen-shell"><canvas id="game" width="480" height="270" aria-label="Game screen"></canvas><div class="touch-ui" aria-label="Touch controls"><div class="dpad"><button class="touch-btn up" data-dir="up" aria-label="Move up">▲</button><button class="touch-btn left" data-dir="left" aria-label="Move left">◀</button><button class="touch-btn center" tabindex="-1">●</button><button class="touch-btn right" data-dir="right" aria-label="Move right">▶</button><button class="touch-btn down" data-dir="down" aria-label="Move down">▼</button></div><div class="touch-actions"><button class="touch-btn action-b" data-action="back">B · BACK</button><button class="touch-btn action-a" data-action="ok">A · OK</button></div></div></div></section>
  <footer class="bottom"><span class="desktop-hint">MOVE WASD / ARROWS &nbsp;·&nbsp; TALK / A: ENTER &nbsp;·&nbsp; MENU: I</span><span class="mobile-hint">Use the pad to explore · A to confirm</span><span>FIELD NOTES&nbsp; № 01</span></footer>
</main>
<script>
(() => {
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=480,H=270,T=16, mapW=52,mapH=38;
const colors={ink:'#253b34',line:'#d9c99b',paper:'#f4e8c8',gold:'#e8bd66'};
const tiles=Array.from({length:mapH},()=>Array(mapW).fill(0));
// Hand-painted route: meadow, winding ochre trail, creek, bridge, and a tiny rest stop.
for(let y=0;y<mapH;y++)for(let x=0;x<mapW;x++)tiles[y][x]=((x*13+y*7)%11===0)?1:0;
for(let y=0;y<mapH;y++){let road=16+Math.round(Math.sin(y*.19)*4);for(let dx=-2;dx<=2;dx++)tiles[y][road+dx]=2;}
for(let x=0;x<mapW;x++)for(let dy=-2;dy<=2;dy++){let road=19+Math.round(Math.sin(x*.16)*3);tiles[road+dy][x]=2;}
// A small pond and footbridge at the upper west.
for(let y=5;y<12;y++)for(let x=5;x<13;x++)if((x-9)**2/18+(y-8)**2/10<1)tiles[y][x]=3;
for(let x=10;x<14;x++)tiles[8][x]=4;
// Building pad and doorstep.
for(let y=15;y<20;y++)for(let x=21;x<27;x++)tiles[y][x]=5;
for(let y=19;y<23;y++)tiles[y][24]=2;
// Detail flowers and tall grass pockets.
const deco=[];for(let i=0;i<100;i++){let x=(i*17+7)%mapW,y=(i*23+3)%mapH;if(tiles[y][x]===0)deco.push({x,y,type:i%5===0?'flower':i%7===0?'rock':'tuft'});}
for(let y=23;y<34;y++)for(let x=32;x<43;x++)if((x*3+y*5)%4!==0)tiles[y][x]=6;

const player={x:24,y:23,dir:'down',walk:0};
const creatures=[
 {name:'Mosskip',kind:'leaf',color:'#87b65b',accent:'#d8e983',hp:22,max:22,move:'Vine Flick'},
 {name:'Cindlet',kind:'ember',color:'#e88955',accent:'#ffd078',hp:20,max:20,move:'Spark Hop'},
 {name:'Puddlefin',kind:'water',color:'#68a9c1',accent:'#caeff0',hp:24,max:24,move:'Bubble Pop'},
 {name:'Bramblet',kind:'leaf',color:'#9b9b57',accent:'#e9d47b',hp:21,max:21,move:'Briar Tap'}
];
let state='field',dialogue=['The old footpath is quiet today.','Walk through the tall grass and see who you meet.'];let dialogIndex=0,dialogueDone=false,toast='',toastUntil=0,steps=0,party=[],berries=3,battle=null,lastTime=0,anim=0,keys={},moveCooldown=0,encounterLock=0;
function text(s,x,y,size=8,color=colors.ink,align='left'){ctx.fillStyle=color;ctx.font=`${size}px monospace`;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillText(s,x,y);}
function box(x,y,w,h,fill='#f4e8c8',stroke='#263b34',radius=3){ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x+.5,y+.5,w-1,h-1,radius);ctx.fill();ctx.stroke();}
function tileDraw(type,sx,sy,x,y){let v=(x*7+y*13)%3;switch(type){case 0:ctx.fillStyle=['#7aae67','#82b875','#76ad68'][v];ctx.fillRect(sx,sy,T,T);if((x+y)%3===0){ctx.fillStyle='#98c47d';ctx.fillRect(sx+3,sy+4,1,2);ctx.fillRect(sx+11,sy+11,1,2);}break;
case 1:ctx.fillStyle='#789f64';ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#71955b';ctx.fillRect(sx+4,sy+5,2,2);break;
case 2:ctx.fillStyle=['#cba86e','#d1b278','#c4a166'][v];ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#b59462';ctx.fillRect(sx+2,sy+4,3,1);ctx.fillRect(sx+10,sy+12,2,1);ctx.fillStyle='#dfc18a';ctx.fillRect(sx+7,sy+2,2,1);break;
case 3:ctx.fillStyle='#5598a0';ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#85c2b9';ctx.fillRect(sx+3,sy+4+(anim%2),5,1);ctx.fillRect(sx+10,sy+11,3,1);break;
case 4:ctx.fillStyle='#986e4c';ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#d2a96c';ctx.fillRect(sx+1,sy+4,14,2);ctx.fillRect(sx+1,sy+10,14,2);break;
case 5:ctx.fillStyle='#89b97a';ctx.fillRect(sx,sy,T,T);break;
case 6:ctx.fillStyle=['#5f9658','#699d5b','#649858'][v];ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#467948';ctx.fillRect(sx+2,sy+7,2,7);ctx.fillRect(sx+7,sy+3,2,11);ctx.fillRect(sx+12,sy+6,2,8);ctx.fillStyle='#9ac76b';ctx.fillRect(sx+3,sy+5,1,3);ctx.fillRect(sx+9,sy+2,1,4);break;}}
function drawTree(sx,sy){ctx.fillStyle='#5e7045';ctx.fillRect(sx+6,sy+12,5,10);ctx.fillStyle='#567c4b';ctx.fillRect(sx+1,sy+4,14,11);ctx.fillStyle='#668d52';ctx.fillRect(sx+3,sy+1,10,10);ctx.fillStyle='#83a75b';ctx.fillRect(sx+5,sy+3,3,2);ctx.fillRect(sx+10,sy+7,2,2);ctx.fillStyle='#344d3a';ctx.fillRect(sx+1,sy+13,14,2);}
function drawFlower(sx,sy){ctx.fillStyle='#456e48';ctx.fillRect(sx+7,sy+7,1,6);ctx.fillStyle='#f0da89';ctx.fillRect(sx+6,sy+5,3,3);ctx.fillStyle='#ec8b79';ctx.fillRect(sx+5,sy+4,1,1);ctx.fillRect(sx+9,sy+4,1,1);}
function drawHouse(){let x=21*T,y=13*T;ctx.fillStyle='#745543';ctx.fillRect(x+10,y+27,76,45);ctx.fillStyle='#d49461';ctx.fillRect(x+8,y+22,80,7);ctx.fillStyle='#b86f54';ctx.fillRect(x+14,y+3,68,24);ctx.fillStyle='#d08a60';ctx.fillRect(x+19,y+8,58,18);ctx.fillStyle='#704c45';ctx.fillRect(x+40,y+45,17,27);ctx.fillStyle='#e7c879';ctx.fillRect(x+44,y+49,9,13);ctx.fillStyle='#547e7c';ctx.fillRect(x+20,y+36,13,12);ctx.fillRect(x+64,y+36,13,12);ctx.fillStyle='#d7bd7d';ctx.fillRect(x+18,y+35,17,2);ctx.fillRect(x+62,y+35,17,2);ctx.fillStyle='#405b47';ctx.fillRect(x+37,y+67,22,4);}
function drawPerson(px,py,shirt='#d69556'){ctx.fillStyle='#344c3a';ctx.fillRect(px+3,py+12,10,3);ctx.fillStyle='#eac18a';ctx.fillRect(px+4,py+3,8,8);ctx.fillStyle='#6b4d3e';ctx.fillRect(px+3,py+1,10,4);ctx.fillStyle=shirt;ctx.fillRect(px+3,py+10,10,8);ctx.fillStyle='#4b5c55';ctx.fillRect(px+4,py+17,3,4);ctx.fillRect(px+10,py+17,3,4);}
function drawPlayer(px,py){let bob=player.walk?Math.floor(anim/5)%2:0;ctx.fillStyle='#314638';ctx.fillRect(px+2,py+13+bob,12,3);ctx.fillStyle='#d9ad79';ctx.fillRect(px+4,py+3,8,8);ctx.fillStyle='#493f38';ctx.fillRect(px+3,py+2,10,4);ctx.fillStyle='#e8ca76';ctx.fillRect(px+2,py+1,12,3);ctx.fillStyle='#b75e49';ctx.fillRect(px+3,py+10,10,7);ctx.fillStyle='#eee0b9';ctx.fillRect(px+7,py+11,2,5);ctx.fillStyle='#32493b';ctx.fillRect(px+4,py+17+bob,3,4);ctx.fillRect(px+10,py+17-bob,3,4);ctx.fillStyle='#273a32';if(player.dir==='left')ctx.fillRect(px+4,py+6,1,1);else if(player.dir==='right')ctx.fillRect(px+11,py+6,1,1);else ctx.fillRect(px+9,py+6,1,1);}
function startDialog(lines,after){dialogue=Array.isArray(lines)?lines:[lines];dialogIndex=0;dialogueDone=false;dialogueAfter=after||null;state='dialog';}
let dialogueAfter=null,menuPage=0,menuIndex=0,battleMessage='',battleTimer=0;
function worldTile(x,y){if(x<0||y<0||x>=mapW||y>=mapH)return 1;return tiles[y][x];}
function blocked(x,y){let t=worldTile(x,y);if(t===3||t===1)return true;if(x>=21&&x<=27&&y>=13&&y<=17)return true;return false;}
function tileOccupied(x,y){return (x===25&&y===19);}
function move(dir){if(state!=='field'||moveCooldown>0)return;player.dir=dir;let dx=dir==='left'?-1:dir==='right'?1:0,dy=dir==='up'?-1:dir==='down'?1:0,nx=player.x+dx,ny=player.y+dy;if(!blocked(nx,ny)&&!tileOccupied(nx,ny)){player.x=nx;player.y=ny;player.walk=1;steps++;encounterLock=Math.max(0,encounterLock-1);let tile=worldTile(nx,ny);if(tile===6&&steps%2===0&&Math.random()<.17){beginEncounter();}else if(tile===2&&steps%24===0){toast='The breeze carries a sweet, leafy scent.';toastUntil=150;} }moveCooldown=9;}
function beginEncounter(){if(state!=='field')return;let pool=creatures.filter(c=>!party.some(p=>p.name===c.name));if(!pool.length)pool=creatures;let template=pool[Math.floor(Math.random()*pool.length)];let wild={...template,hp:template.max,level:1+Math.floor(Math.random()*3)};battle={wild,turn:'player',menu:0,phase:'choose',message:`A wild ${wild.name} appeared!`,turns:0};state='battle';}
function endBattle(message){battle=null;state='field';encounterLock=8;toast=message;toastUntil=180;}
function attack(){if(!battle||battle.phase!=='choose')return;let lead=party[0];if(!lead){battle.message='You have no companions yet!';return;}let dmg=4+Math.floor(Math.random()*5);battle.wild.hp=Math.max(0,battle.wild.hp-dmg);battle.message=`${lead.name} used ${lead.move}!`;battle.phase='message';battleTimer=48;battle.returnFoe=true;if(battle.wild.hp<=0){battle.phase='win';battleTimer=54;battle.returnFoe=false;}}
function catchWild(){if(!battle||battle.phase!=='choose')return;if(berries<=0){battle.message='No berries left!';battle.phase='message';battleTimer=42;battle.returnFoe=true;return;}berries--;let chance=.38+(1-battle.wild.hp/battle.wild.max)*.48;if(Math.random()<chance){const caught={...battle.wild,hp:battle.wild.max};if(party.length<4){party.push(caught);battle.message=`${caught.name} joined your field team!`;}else{battle.message=`${caught.name} was noted, but your team is full.`;}battle.phase='win';battleTimer=62;battle.returnFoe=false;}else{battle.message=`${battle.wild.name} wriggled free!`;battle.phase='message';battleTimer=45;battle.returnFoe=true;}}
function runAway(){if(Math.random()<.75){endBattle('You slipped away safely.');return;}battle.message=`${battle.wild.name} blocks the path!`;battle.phase='message';battleTimer=42;battle.returnFoe=true;}
function useBerry(){if(!party.length){battle.message='No companion to heal.';battle.phase='message';battleTimer=40;battle.returnFoe=true;return;}if(berries<=0){battle.message='You are out of berries.';battle.phase='message';battleTimer=40;battle.returnFoe=true;return;}let p=party[0];if(p.hp>=p.max){battle.message=`${p.name} is already feeling great.`;battle.phase='message';battleTimer=40;battle.returnFoe=true;return;}berries--;p.hp=Math.min(p.max,p.hp+10);battle.message=`A berry restored ${p.name}'s energy!`;battle.phase='message';battleTimer=48;battle.returnFoe=true;}
function confirm(){if(state==='dialog'){dialogIndex++;if(dialogIndex>=dialogue.length){state='field';if(dialogueAfter){let fn=dialogueAfter;dialogueAfter=null;fn();}}return;}if(state==='field'){const tx=player.x+(player.dir==='right'?1:player.dir==='left'?-1:0),ty=player.y+(player.dir==='down'?1:player.dir==='up'?-1:0);if(tx===25&&ty===19){startDialog(['Professor Fern: Welcome to Cloverfield!','The tall grass is full of curious little friends.','Find one, then toss a berry when it is tired.','I left three berries in your satchel. Safe travels!'],()=>{if(!party.length){party.push({...creatures[0],hp:creatures[0].max,level:1});toast='Mosskip joined your team!';toastUntil=180;}});return;}if(tx===24&&ty===22){startDialog(['A wooden sign reads:','CLOVERFIELD PATH — follow the creek north.','Tall grass rustles with wildbound friends.']);return;}return;}if(state==='menu'){menuSelect();return;}if(state==='battle'){battleAction();}}
function foeTurn(){if(!battle)return;battle.returnFoe=false;if(party.length){let p=party[0],dmg=2+Math.floor(Math.random()*5);p.hp=Math.max(0,p.hp-dmg);battle.message=`${battle.wild.name} bumped ${p.name} for ${dmg}!`;if(p.hp<=0){p.hp=0;battle.phase='foeMessage';battle.message+=` ${p.name} needs a rest.`;battleTimer=45;return;}}else battle.message=`${battle.wild.name} rustles at you.`;battle.phase='foeMessage';battleTimer=42;}
function battleAction(){if(battle.phase==='message'){if(battle.returnFoe)foeTurn();else{battle.phase='choose';battle.menu=0;}return;}if(battle.phase==='foeMessage'){if(party.length&&party[0].hp<=0){party[0].hp=party[0].max;endBattle(`${party[0].name} rested up at the field station.`);}else{battle.phase='choose';battle.menu=0;}return;}if(battle.phase==='win'){endBattle(battle.message);return;}if(battle.phase!=='choose')return;switch(battle.menu){case 0:attack();break;case 1:catchWild();break;case 2:useBerry();break;case 3:runAway();break;}}
function back(){if(state==='menu'){state='field';return;}if(state==='battle'){if(battle.phase==='choose')runAway();else if(battle.phase==='message')battleAction();return;}if(state==='field'){state='menu';menuIndex=0;menuPage=0;}}
function menuSelect(){if(menuIndex===0){if(!party.length)startDialog(['Your team is empty.','Talk to Professor Fern beside the cottage to begin your journey.']);else startDialog(party.map((p,i)=>`${i+1}. ${p.name}  HP ${p.hp}/${p.max}  · Lv.${p.level||1}`));}else if(menuIndex===1){startDialog([`Satchel: ${berries} field berries.`,`Berries restore 10 energy in a battle.`]);}else if(menuIndex===2){startDialog(['Move with WASD or the arrow keys.','Press Enter / Space to interact.','Press I or Escape for your field journal.']);}else state='field';}
function keyDown(e){let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','enter'].includes(k))e.preventDefault();if(keys[k])return;keys[k]=true;if(k==='i'||k==='escape'){back();return;}if(k==='enter'||k===' '||k==='z'){confirm();return;}if(k==='x'||k==='backspace'){back();return;}if(state==='menu'){if(k==='arrowup'||k==='w')menuIndex=(menuIndex+3)%4;if(k==='arrowdown'||k==='s')menuIndex=(menuIndex+1)%4;return;}if(state==='battle'&&battle.phase==='choose'){if(k==='arrowup'||k==='w'||k==='arrowleft'||k==='a')battle.menu=(battle.menu+3)%4;if(k==='arrowdown'||k==='s'||k==='arrowright'||k==='d')battle.menu=(battle.menu+1)%4;return;}if(k==='arrowup'||k==='w')move('up');else if(k==='arrowdown'||k==='s')move('down');else if(k==='arrowleft'||k==='a')move('left');else if(k==='arrowright'||k==='d')move('right');}
function keyUp(e){keys[e.key.toLowerCase()]=false;}
function drawWorld(){const camX=Math.max(0,Math.min(mapW*T-W,player.x*T+T/2-W/2)),camY=Math.max(0,Math.min(mapH*T-H,player.y*T+T/2-H/2));ctx.save();ctx.translate(-Math.floor(camX),-Math.floor(camY));let x0=Math.floor(camX/T),y0=Math.floor(camY/T),x1=Math.ceil((camX+W)/T),y1=Math.ceil((camY+H)/T);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)tileDraw(worldTile(x,y),x*T,y*T,x,y);
for(const d of deco){if(d.x<x0-1||d.x>x1||d.y<y0-1||d.y>y1)continue;let sx=d.x*T,sy=d.y*T;if(d.type==='flower')drawFlower(sx,sy);else if(d.type==='rock'){ctx.fillStyle='#84947b';ctx.fillRect(sx+5,sy+8,6,5);ctx.fillStyle='#a5af8a';ctx.fillRect(sx+6,sy+8,3,2);}else{ctx.fillStyle='#91bf70';ctx.fillRect(sx+4,sy+8,1,4);ctx.fillRect(sx+11,sy+6,1,5);}}
// Tree canopies and cottage are drawn in the foreground layer.
for(let y=y0-1;y<y1;y++)for(let x=x0-1;x<x1;x++)if(worldTile(x,y)===1)drawTree(x*T,y*T);
drawHouse();drawPerson(25*T,19*T,'#6c9b76');drawPlayer(player.x*T+1,player.y*T-3);
ctx.restore();return {camX,camY};}
function drawHUD(){box(7,7,128,20,'#203c31','#c5ce9e',4);text('CLOVERFIELD PATH',14,13,7,'#f3e7c5');box(388,7,85,20,'#203c31','#c5ce9e',4);text(`✿ ${berries}   TEAM ${party.length}/4`,430,13,7,'#f3e7c5','center');}
function drawCreature(c,x,y,scale=1,flip=false){ctx.save();ctx.translate(x,y);if(flip){ctx.scale(-1,1);}ctx.scale(scale,scale);let bob=Math.sin(anim/9)*2;ctx.fillStyle='#243a32';ctx.fillRect(-14,13+bob,28,5);ctx.fillStyle=c.color;ctx.fillRect(-13,-3+bob,26,18);ctx.fillRect(-9,-10+bob,18,12);ctx.fillRect(-17,2+bob,7,9);ctx.fillRect(10,2+bob,7,9);ctx.fillStyle=c.accent;ctx.fillRect(-8,-9+bob,5,4);ctx.fillRect(5,-9+bob,4,4);ctx.fillStyle='#263a34';ctx.fillRect(-6,-4+bob,2,2);ctx.fillRect(5,-4+bob,2,2);ctx.fillStyle=c.color;ctx.fillRect(-8,14+bob,6,6);ctx.fillRect(3,14+bob,6,6);if(c.kind==='leaf'){ctx.fillStyle='#55834b';ctx.fillRect(-3,-16+bob,6,7);ctx.fillRect(1,-19+bob,7,4);}else if(c.kind==='ember'){ctx.fillStyle='#f6b85d';ctx.fillRect(-3,-17+bob,6,7);ctx.fillRect(-1,-20+bob,3,4);}else{ctx.fillStyle='#b5e3db';ctx.fillRect(-10,-13+bob,4,3);ctx.fillRect(7,-13+bob,4,3);}ctx.restore();}
function drawBar(x,y,w,h,hp,max){ctx.fillStyle='#526554';ctx.fillRect(x,y,w,h);ctx.fillStyle=hp/max>.5?'#76a95d':hp/max>.25?'#d1ae57':'#ce7656';ctx.fillRect(x+1,y+1,Math.max(0,(w-2)*(hp/max)),h-2);ctx.strokeStyle='#294438';ctx.strokeRect(x+.5,y+.5,w-1,h-1);}
function drawBattle(){ctx.fillStyle='#d9e3bb';ctx.fillRect(0,0,W,H);ctx.fillStyle='#bdd2a1';ctx.fillRect(0,0,W,145);ctx.fillStyle='#9bbd82';ctx.fillRect(0,145,W,125);for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#a2c28a':'#a9c790';ctx.fillRect(i*68,146+(i%3)*8,50,4);}ctx.fillStyle='#7fa575';ctx.beginPath();ctx.ellipse(336,151,82,17,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(134,198,92,20,0,0,Math.PI*2);ctx.fill();drawCreature(battle.wild,334,116,1.9);if(party.length)drawCreature(party[0],142,165,1.8,true);
box(17,18,171,43,'#f4e8c8','#33493a',5);text(`WILD  ${battle.wild.name}`,26,26,9);text(`Lv.${battle.wild.level||1}`,177,26,7,'#536552','right');drawBar(27,43,145,7,battle.wild.hp,battle.wild.max);if(party.length){box(286,135,178,42,'#f4e8c8','#33493a',5);text(party[0].name,296,142,9);text(`Lv.${party[0].level||1}`,453,142,7,'#536552','right');drawBar(296,159,145,7,party[0].hp,party[0].max);text(`${party[0].hp}/${party[0].max}`,450,158,7,'#536552','right');}
if(battle.phase==='choose'){box(7,207,265,56,'#f4e8c8','#33493a',5);text(battle.message,16,215,8);box(282,190,191,73,'#f4e8c8','#33493a',5);let opts=['Move','Throw','Heal','Run'];for(let i=0;i<4;i++){let x=295+(i%2)*84,y=200+Math.floor(i/2)*25;text((battle.menu===i?'▶ ':'  ')+opts[i],x,y,8,battle.menu===i?'#a3573e':colors.ink);}text('A · SELECT',462,249,6,'#536552','right');}else{box(7,207,466,56,'#f4e8c8','#33493a',5);text(battle.message,17,218,8);text('A · CONTINUE',459,245,6,'#536552','right');}}
function drawDialog(){ctx.fillStyle='#19291e77';ctx.fillRect(0,0,W,H);box(10,184,460,76,'#f5e9c9','#273e33',6);let line=dialogue[dialogIndex]||'';text(line,23,199,9,colors.ink);text('A  ·  CONTINUE',451,241,7,'#647253','right');}
function drawMenu(){ctx.fillStyle='#15261f66';ctx.fillRect(0,0,W,H);box(132,38,216,195,'#f3e8c9','#293e34',7);text('FIELD JOURNAL',240,51,10,'#52694d','center');text('CLOVERFIELD  ·  ROUTE 01',240,67,6,'#8a8060','center');let opts=['Companions','Satchel','How to play','Return'];opts.forEach((v,i)=>{let y=91+i*29;box(151,y,178,23,menuIndex===i?'#e7d4a0':'#efe2c1',menuIndex===i?'#a97045':'#b6ad89',4);text((menuIndex===i?'✦ ':'  ')+v,163,y+7,8,menuIndex===i?'#593f31':colors.ink);});text('↑ ↓ CHOOSE   ENTER OPEN   ESC CLOSE',240,214,6,'#6c7158','center');}
function drawToast(){if(toast&&toastUntil>0){box(102,222,276,34,'#f4e8c8','#34483a',5);text(toast,240,234,7,colors.ink,'center');}}
function render(){ctx.clearRect(0,0,W,H);if(state==='battle'){drawBattle();}else{drawWorld();drawHUD();if(state==='dialog')drawDialog();if(state==='menu')drawMenu();drawToast();}document.getElementById('count').textContent=party.length;}
function update(dt){anim+=dt/16.67;if(moveCooldown>0)moveCooldown--;if(state==='field'&&moveCooldown===0){if(keys.arrowup||keys.w)move('up');else if(keys.arrowdown||keys.s)move('down');else if(keys.arrowleft||keys.a)move('left');else if(keys.arrowright||keys.d)move('right');}if(toastUntil>0)toastUntil--;if(state==='battle'&&battleTimer>0){battleTimer--;if(battleTimer===0){if(battle.phase==='message'){if(battle.returnFoe)foeTurn();else battle.phase='choose';}else if(battle.phase==='foeMessage'){if(party.length&&party[0].hp<=0){party[0].hp=party[0].max;endBattle(`${party[0].name} rested up at the field station.`);}else battle.phase='choose';}}}}
function frame(now){let dt=Math.min(40,now-(lastTime||now));lastTime=now;update(dt);render();requestAnimationFrame(frame);}
window.addEventListener('keydown',keyDown);window.addEventListener('keyup',keyUp);window.addEventListener('blur',()=>{keys={};});
for(const button of document.querySelectorAll('.touch-btn[data-dir]')){button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);keys[button.dataset.dir==='up'?'arrowup':button.dataset.dir==='down'?'arrowdown':button.dataset.dir==='left'?'arrowleft':'arrowright']=true;move(button.dataset.dir);});for(const ev of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(ev,()=>{keys={};});}
for(const button of document.querySelectorAll('.touch-btn[data-action]'))button.addEventListener('pointerdown',e=>{e.preventDefault();if(button.dataset.action==='ok')confirm();else back();});
startDialog(['Welcome to Wildbound!','Walk the Cloverfield path and meet its little wild friends.','Find Professor Fern beside the cottage to begin.']);
requestAnimationFrame(frame);
})();
</script>
